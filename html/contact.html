<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=at, initial-scale=1.0">
    <title>Clinton Resources</title>
    <link rel="icon" href="../images/favicon.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Clinton Recource Center</h1>

    </header>
    <ul class="options">
        <li><a href="../index.html">Home</a></li>
        <li><a href="events.html">Events/Calander</a></li>
        <li><a href="volunteer.html">Recources</a></li>
        <li><a href="poi.html">POIs</a></li>
        <li><a href="contact.html">Contact Us/Add Resources</a></li>
        <li><a href="about.html">About</a></li>
    </ul>
    <main>
        <div id="selection">
            <button id="contact" onclick="contactings()">Send a direct message to the developers</button>
            <button id="add" onclick="addings()">Add a resourse to the page</button>
        </div>
        <form id="adding">
            <h2>Add a Recource</h2>
            <input placeholder="Resource/Event Name" id="eventName" name="eventName"><br>
            <input placeholder="Date of Event (Na if none)" id="dateOf" name="dateOf"><br>
            <input placeholder="Organization name" id="oversee" name="oversee"><br>
            <textarea placeholder="Add a short description" id="desc" name="desc"></textarea><br>
            <input placeholder="Email or phone (Na if anomynous)" id="contactAdd" name="contactAdd"><br>
            <button type="submit" id="subAdd">Submit</button>
        </form>
        <form id="messageForm">
            <h2>Send Direct Message</h2>
            <textarea placeholder="Message" id="mess" name="mess"></textarea><br>
            <input placeholder="Email or phone (Na if anomynous)" id="contactMess" name="contactMess"><br>
            <button type="submit" id="subAdd">Submit</button>

        </form>
    </main>
    <footer>
        <p>TSA Webmasters Project</p>
    </footer>
    <script src="../contact.js"></script>
    <script type="module" src="../contactSub.js"></script>
</body>
